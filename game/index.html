<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102f39" />
    <link rel="icon" href="data:," />
    <title>Solstice Heat — A summer in Solstice Bay</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #102f39;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        width: min(100vw, 177.7778vh);
        height: min(56.25vw, 100vh);
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas
      width="1280"
      height="720"
      aria-label="Solstice Heat game. Press Enter to start. WASD moves, E interacts, P opens your phone."
    ></canvas>

    <script defer src="./src/input.js"></script>
    <script defer src="./src/city.js"></script>
    <script defer src="./src/particles.js"></script>

    <script defer src="./src/pedestrians.js"></script>

    <script defer src="./src/dialogue.js"></script>
    <script defer src="./src/missions.js"></script>
    <script defer src="./src/economy.js"></script>
    <script defer src="./src/save.js"></script>
    <script defer src="./src/radio.js"></script>
    <script defer src="./src/audio.js"></script>
    <script defer src="./src/staging.js"></script>
    <script defer src="./src/minimap.js"></script>
